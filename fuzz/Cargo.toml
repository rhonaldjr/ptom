[package]
name = "farsight-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Separate workspace: built with nightly by cargo-fuzz, outside the layer check.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
farsight-rfb = { path = "../crates/farsight-rfb" }
farsight-security = { path = "../crates/farsight-security" }
farsight-codec = { path = "../crates/farsight-codec" }
farsight-discovery = { path = "../crates/farsight-discovery" }
farsight-server = { path = "../crates/farsight-server" }
secrecy = "0.10"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

[[bin]]
name = "rfb_version"
path = "fuzz_targets/rfb_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rfb_pixel_format"
path = "fuzz_targets/rfb_pixel_format.rs"
test = false
doc = false
bench = false

