name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev && sudo bash ci/install-spa-headers.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: scripts/check-layers.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is tier 2 (ADR-0004): reported, never release-blocking.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev xvfb && sudo bash ci/install-spa-headers.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked
      - name: Tray icon on a private D-Bus (with and without a host)
        if: runner.os == 'Linux'
        run: dbus-run-session -- env FARSIGHT_TRAY_TEST=1 cargo test -p farsight-desktop --test tray_host --locked

  interop:
    # Black-box interop against real TigerVNC servers (ADR-0011 allows this).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { base: "debian:bookworm-slim", security: VncAuth, encrypted: "0" }
          - { base: "debian:bookworm-slim", security: None, encrypted: "0" }
          - { base: "debian:trixie-slim", security: X509Vnc, encrypted: "1" }
          - { base: "debian:trixie-slim", security: RA2, encrypted: "1" }
          - { base: "debian:trixie-slim", security: RA2_256, encrypted: "1" }
    name: interop (${{ matrix.security }})
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start TigerVNC
        run: |
          docker build --build-arg BASE=${{ matrix.base }} -t farsight-interop-tigervnc tests/interop/tigervnc
          docker run -d -e SECURITY=${{ matrix.security }} -p 127.0.0.1:15901:5901 farsight-interop-tigervnc
          sleep 5
      - run: cargo test -p farsight-net --test interop_tigervnc --locked -- --nocapture
        env:
          FARSIGHT_INTEROP_ADDR: 127.0.0.1::15901
          FARSIGHT_INTEROP_EXPECT_ENCRYPTED: ${{ matrix.encrypted }}

  agent-e2e:
    # farsight-agent sharing a real X server (Xvfb), checked by a Farsight viewer session (M5).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils x11-xserver-utils
      - run: cargo build -p farsight-agent -p farsight-passwd --locked
      - run: tests/e2e/agent-x11.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each fuzz target briefly
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$target" -- -max_total_time=30
          done
