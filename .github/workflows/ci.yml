name: CI

on:
  pull_request:
  workflow_call:
  # Milestone and CI branches get the same gate before they reach main.
  push:
    branches: ["m*/**", "ci/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libpixman-1-dev && sudo bash ci/install-spa-headers.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Benchmarks build
        run: cargo bench --workspace --no-run --locked
      - run: scripts/check-layers.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    # macOS is tier 2 (ADR-0004): reported, never release-blocking.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libpixman-1-dev xvfb && sudo bash ci/install-spa-headers.sh
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo test --workspace --all-features --locked
          else
            # The agent and its capture backends are Linux-only (ADR-0004); PipeWire doesn't build on macOS.
            cargo test --workspace --locked --exclude farsight-agent --exclude farsight-capture-wayland --exclude farsight-capture-x11 --exclude farsight-headless
          fi
      - name: macOS app bundle and disk image (as the release builds them)
        if: runner.os == 'macOS'
        run: |
          cargo build -p farsight --locked
          scripts/macos-app.sh 0.0.0 target/debug/farsight dist
          scripts/macos-dmg.sh 0.0.0 dist/Farsight.app dist/farsight-test.dmg
          hdiutil imageinfo dist/farsight-test.dmg >/dev/null
      - name: Tray icon on a private D-Bus (with and without a host)
        if: runner.os == 'Linux'
        run: dbus-run-session -- env FARSIGHT_TRAY_TEST=1 cargo test -p farsight-desktop --test tray_host --locked

  interop:
    # Black-box interop against real VNC servers (ADR-0011 allows this).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { server: tigervnc, base: "debian:bookworm-slim", security: VncAuth, encrypted: "0" }
          - { server: tigervnc, base: "debian:bookworm-slim", security: None, encrypted: "0" }
          - { server: tigervnc, base: "debian:trixie-slim", security: X509Vnc, encrypted: "1" }
          - { server: tigervnc, base: "debian:trixie-slim", security: RA2, encrypted: "1" }
          - { server: tigervnc, base: "debian:trixie-slim", security: RA2_256, encrypted: "1" }
          - { server: tightvnc, base: "debian:bookworm-slim", security: VncAuth, encrypted: "0" }
    name: interop (${{ matrix.server }} ${{ matrix.security }})
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start the server
        run: |
          docker build --build-arg BASE=${{ matrix.base }} -t farsight-interop tests/interop/${{ matrix.server }}
          docker run -d -e SECURITY=${{ matrix.security }} -p 127.0.0.1:15901:5901 farsight-interop
          # Wait for the RFB greeting rather than a fixed time (X509 setups start slower).
          for _ in $(seq 60); do
            if timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/15901 && head -c 4 <&3' 2>/dev/null | grep -q RFB; then exit 0; fi
            sleep 1
          done
          docker logs "$(docker ps -lq)"
          echo "::error title=interop::the VNC server did not start"
          exit 1
      - run: cargo test -p farsight-net --test interop_tigervnc --locked -- --nocapture
        env:
          FARSIGHT_INTEROP_ADDR: 127.0.0.1::15901
          FARSIGHT_INTEROP_EXPECT_ENCRYPTED: ${{ matrix.encrypted }}

  viewer-interop:
    # The other direction: TigerVNC's own viewer connects to the Farsight agent.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libpixman-1-dev
      - run: cargo build -p farsight-agent -p farsight-passwd --locked
      - run: tests/e2e/tigervnc-viewer.sh

  agent-e2e:
    # farsight-agent sharing a real X server (Xvfb), checked by a Farsight viewer session (M5).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb x11-utils x11-xserver-utils libxkbcommon-dev libpixman-1-dev
      - run: cargo build -p farsight-agent -p farsight-passwd --locked
      - run: tests/e2e/agent-x11.sh
      - run: tests/e2e/compat-names.sh

  headless:
    # M7: the headless compositor with real apps. Ubuntu 24.04 for Xwayland 23.1+
    # (X11 apps); foot is the Wayland app in the end-to-end test.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libpixman-1-dev xwayland libegl1 foot fonts-dejavu-core
      - name: Compositor tests (X11 window, input, resize, viewers frame, monitors)
        run: cargo test -p farsight-headless --locked -- --nocapture
      - run: cargo build -p farsight-agent -p farsight-passwd --locked
      - run: tests/e2e/agent-headless.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # AddressSanitizer crashes on runner kernels with high mmap randomisation.
      - name: Make ASan-compatible address randomisation
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Run each fuzz target briefly
        working-directory: fuzz
        run: |
          status=0
          for target in $(cargo +nightly fuzz list); do
            # The prebuilt cargo-fuzz is a musl build and would default to musl, which ASan cannot use.
            if ! cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=30 > "/tmp/$target.log" 2>&1; then
              status=1
              cat "/tmp/$target.log"
              # Annotations are readable without a login, which helps remote triage.
              echo "::error title=fuzz $target::$(grep -v '^\s*\(Compiling\|Downloaded\|#[0-9]\)' "/tmp/$target.log" | tail -c 3000 | tr '\n' ' ')"
            fi
          done
          exit $status
