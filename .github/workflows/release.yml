# Every push to main cuts a versioned release (ADR-0005).
name: Release

on:
  push:
    branches: [main]

# Serialise releases so version computation never races. A push that arrives
# while another is queued supersedes it; its commits ship in the next release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - id: next
        run: |
          version="$(git cliff --bumped-version)"
          echo "version=${version#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, bins: "farsight farsight-agent farsight-passwd farsight-sharing", tier: 1 }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, bins: "farsight farsight-agent farsight-passwd farsight-sharing", tier: 1 }
          - { os: macos-latest, target: aarch64-apple-darwin, bins: "farsight farsight-passwd", tier: 2 }
          # Intel Macs: cross-compiled on the same (Apple Silicon) runner.
          - { os: macos-latest, target: x86_64-apple-darwin, bins: "farsight farsight-passwd", tier: 2 }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.tier == 2 }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
      BINS: ${{ matrix.bins }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install GUI build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig-dev libfreetype-dev libdbus-1-dev libpipewire-0.3-dev libclang-dev libpixman-1-dev && sudo bash ci/install-spa-headers.sh
      - name: Stamp version
        run: |
          perl -0pi -e 's/^version = "0\.0\.0"/version = "$ENV{VERSION}"/m' Cargo.toml
          cargo update --workspace
      - name: Build
        run: |
          features=""
          if [ "$RUNNER_OS" = "Linux" ]; then features="--features farsight-agent/wayland"; fi
          cargo build --release --locked --target "$TARGET" $(printf -- '-p %s ' $BINS) $features
      - name: Package
        run: |
          name="farsight-${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          for bin in $BINS; do cp "target/$TARGET/release/$bin" "dist/$name/"; done
          cp LICENSE README.md "dist/$name/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            scripts/macos-app.sh "$VERSION" "target/$TARGET/release/farsight" "dist/$name"
            scripts/macos-dmg.sh "$VERSION" "dist/$name/Farsight.app" "dist/$name.dmg"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Benchmarks (published with the release, M8)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          out="dist/benchmarks-${VERSION}.txt"
          cargo bench --locked -p farsight-codec -p farsight-server -- --quick > bench.log 2>&1 || true
          grep -E 'KiB|time:|^1080p|^agent' bench.log > "$out" || true
          # Never an empty asset (GitHub refuses those): say what happened instead.
          if [ ! -s "$out" ]; then
            { echo "Benchmarks did not produce results on this runner; last lines:"; tail -20 bench.log; } > "$out"
          fi
      - name: Debian packages (farsight viewer, farsight-agent server)
        if: runner.os == 'Linux'
        run: scripts/build-deb.sh "$VERSION" "target/$TARGET/release" dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/*.txt

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        # macOS is tier 2: its files may be missing if that build failed.
        run: cd dist && shopt -s nullglob && sha256sum *.tar.gz *.deb *.dmg benchmarks-*.txt > SHA256SUMS
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - name: Release notes
        run: git cliff --unreleased --tag "v$VERSION" --strip all > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: farsight v${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
            dist/benchmarks-*.txt
            dist/SHA256SUMS
