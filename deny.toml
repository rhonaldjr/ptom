# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive crates (mostly via libcosmic) are tracked upstream;
# only our direct dependencies must be maintained.
unmaintained = "workspace"

[licenses]
version = 2
# MIT-compatible licences only (ADR-0011).
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0", "Unlicense",
]
confidence-threshold = 0.9

# jpeg-encoder (Tight JPEG, M8) is partly derived from the IJG's libjpeg: a
# permissive licence that asks for a credit, given in README.md.
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

# Crates from libcosmic's git repositories that omit the `license` field.
# Verified against the LICENSE files in each repository (2026-10-23).
[[licenses.clarify]]
crate = "cosmic-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-config-derive"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-theme"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-settings-daemon"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "dnd"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "mime"
expression = "MIT"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # ADR-0007: no OpenSSL / GnuTLS in the trust boundary.
  { name = "openssl-sys" },
  { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# libcosmic is git-only (ADR-0003); it and its forks live in these orgs.
allow-git = []

[sources.allow-org]
github = ["pop-os", "iced-rs", "jackpot51"]
