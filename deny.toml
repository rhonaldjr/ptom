# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# MIT-compatible licences only (ADR-0011).
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  # ADR-0007: no OpenSSL / GnuTLS in the trust boundary.
  { name = "openssl-sys" },
  { name = "openssl" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# libcosmic is git-only (ADR-0003); add its repo here when the viewer UI lands.
allow-git = []
