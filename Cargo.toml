[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["fuzz"]
# The Wayland backend needs PipeWire and patched SPA headers (ci/install-spa-headers.sh),
# so plain `cargo build`/`cargo test` skip it; CI uses --workspace --all-features (P-24).
default-members = [
  "apps/farsight",
  "apps/farsight-agent",
  "apps/farsight-passwd",
  "crates/farsight-capture-x11",
  "crates/farsight-client",
  "crates/farsight-codec",
  "crates/farsight-desktop",
  "crates/farsight-discovery",
  "crates/farsight-net",
  "crates/farsight-rfb",
  "crates/farsight-security",
  "crates/farsight-server",
  "crates/farsight-vault",
]

[workspace.package]
# Stamped from the git tag by .github/workflows/release.yml (ADR-0005). Do not edit by hand.
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/rhonaldjr/ptom"
authors = ["Akrogoniaios Technologies Corp."]

[workspace.dependencies]
# Internal crates
farsight-rfb = { path = "crates/farsight-rfb" }
farsight-codec = { path = "crates/farsight-codec" }
farsight-security = { path = "crates/farsight-security" }
farsight-client = { path = "crates/farsight-client" }
farsight-server = { path = "crates/farsight-server" }
farsight-net = { path = "crates/farsight-net" }
farsight-vault = { path = "crates/farsight-vault" }
farsight-discovery = { path = "crates/farsight-discovery" }
farsight-desktop = { path = "crates/farsight-desktop" }
farsight-capture-x11 = { path = "crates/farsight-capture-x11" }
farsight-capture-wayland = { path = "crates/farsight-capture-wayland" }

# External
anyhow = "1"
zbus = { version = "5", default-features = false, features = ["async-io"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
ksni = "0.3"
notify-rust = { version = "4.18", default-features = false, features = ["z", "tokio"] }
bytes = "1"
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "430f3d48a97d8779f9c1985473912e594ccca1ae", default-features = false, features = ["winit", "tokio", "wgpu", "multi-window"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustix = { version = "1", features = ["process"] }
# Pure-Rust X11 protocol (no Xlib, no libxcb); used by farsight-capture-x11.
x11rb = { version = "0.13", features = ["damage", "xfixes", "xtest", "shm", "randr"] }
thiserror = "2"
des = "0.8"
aes = "0.9"
aws-lc-rs = "1.18"
eax = "0.5"
sha1 = { version = "0.11", default-features = false }
secrecy = "0.10"
subtle = "2.6"
zeroize = "1"
proptest = "1"
# Pure-Rust codecs (miniz_oxide backend, no zlib-sys).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
zune-jpeg = "0.5.15"
zune-core = "0.5"

# Vault and credentials (ADR-0008, ADR-0014). Pure Rust; RustCrypto only (ADR-0007).
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "getrandom"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
getrandom = "0.4"
hkdf = "0.13"
sha2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tempfile = "3"
keyring-core = "1"
# Secret Service over zbus with async-io and RustCrypto: no tokio, no libdbus, no OpenSSL.
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
apple-native-keyring-store = { version = "1", features = ["keychain"] }
rpassword = "7"

# LAN discovery (ADR-0010, ADR-0012). Pure-Rust mDNS; interface enumeration.
mdns-sd = { version = "0.21", default-features = false, features = ["async"] }
if-addrs = "0.15"
# Wayland capture (M4). ashpd runs on zbus's async-io runtime, like the keyring store, so the
# workspace keeps a single zbus runtime. pipewire binds libpipewire (needs libpipewire-0.3-dev
# and libclang-dev). It links against Ubuntu 22.04's libpipewire 0.3.48 but needs newer SPA
# headers to compile: ci/install-spa-headers.sh.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
pipewire = "0.10"
futures-util = { version = "0.3", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
cast_possible_truncation = "deny"
dbg_macro = "deny"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
