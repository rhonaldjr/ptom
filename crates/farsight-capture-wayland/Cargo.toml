[package]
name = "farsight-capture-wayland"
description = "Wayland screen capture and input injection via xdg-desktop-portal and PipeWire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
farsight-codec.workspace = true
farsight-rfb.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
farsight-gpu-sys = { workspace = true, optional = true }
ashpd.workspace = true
pipewire.workspace = true
futures-util.workspace = true

[features]
# Accept the screen as a DMA-BUF (GPU buffer) when the compositor offers one
# (M10, ADR-0021). Off by default and in releases until tested by hand (U-14).
dmabuf = ["dep:farsight-gpu-sys"]

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
