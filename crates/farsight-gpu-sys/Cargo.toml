[package]
name = "farsight-gpu-sys"
description = "The only unsafe code in Farsight: DMA-BUF synchronisation and GPU video encoding (ADR-0021)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# VA-API H.264 encoding (libva loaded at run time).
va = ["dep:libloading"]
# NVENC H.264 encoding on NVIDIA GPUs (driver libraries loaded at run time).
nvenc = ["dep:libloading"]

[dependencies]
rustix = { workspace = true, features = ["fs", "mm"] }
thiserror.workspace = true
libloading = { workspace = true, optional = true }

# Not the workspace lints: `unsafe_code = "forbid"` can't be relaxed per
# function, so this crate denies it and allows it only where documented
# (ADR-0021). Everything else matches the workspace.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
